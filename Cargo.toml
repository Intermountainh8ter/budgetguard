[package]
name = "budgetguard"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Verify that agent frameworks actually honor declared budgets (tokens, tool calls, USD) under adversarial inputs."
repository = "https://github.com/Intermountainh8ter/budgetguard"
keywords = ["llm", "agent", "budget", "safety", "audit"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time"] }
thiserror = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[[bin]]
name = "budgetguard"
path = "src/main.rs"

[lib]
name = "budgetguard"
path = "src/lib.rs"
